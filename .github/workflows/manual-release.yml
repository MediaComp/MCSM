name: Create release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New stable version, for example 1.4.1 (optional v prefix)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mcsm-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Require the default branch
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Run this workflow from $DEFAULT_BRANCH."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Validate version and release state
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(python3 scripts/release.py normalize "$INPUT_VERSION")"
          tag="v$version"
          draft="$(gh api --paginate "repos/$GH_REPO/releases" \
            --jq ".[] | select(.tag_name == \"$tag\") | .draft")"
          if [ -n "$draft" ] && [ "$draft" != "true" ]; then
            echo "::error::Release $tag is already published; use a higher version."
            exit 1
          fi

          resume=false
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            current="$(python3 scripts/release.py current)"
            if [ "$current" != "$version" ]; then
              echo "::error::Cannot resume $tag: $DEFAULT_BRANCH now carries version $current."
              exit 1
            fi
            commit="$(git rev-parse "$tag^{commit}")"
            if ! git merge-base --is-ancestor "$commit" HEAD || \
               [ "$(git log -1 --format=%s "$commit")" != "Release $tag" ]; then
              echo "::error::Tag $tag already exists and is not a release commit on $DEFAULT_BRANCH."
              exit 1
            fi
            # Resume the exact package after a failed upload, even if main advanced.
            git checkout --detach "$commit"
            resume=true
          elif [ -n "$draft" ]; then
            echo "::error::Draft $tag exists without its Git tag; inspect it before retrying."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Update plugin version and changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          RESUME: ${{ steps.version.outputs.resume }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [ "$RESUME" = "true" ]; then
            python3 scripts/release.py prepare "$VERSION" --resume > "$notes"
          else
            python3 scripts/release.py prepare "$VERSION" > "$notes"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add mcsm.php README.md
            git commit -m "Release $TAG"
          fi

      - name: Check PHP syntax
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: Build and verify the installable package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git archive --format=zip --prefix=mcsm/ --output="$RUNNER_TEMP/mcsm.zip" HEAD
          python3 scripts/release.py verify "$VERSION" "$RUNNER_TEMP/mcsm.zip"

      - name: Push the version commit and tag together
        if: steps.version.outputs.resume != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          # A concurrent branch update rejects both refs; never force-push.
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG:refs/tags/$TAG"

      - name: Create a draft and attach the package
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ steps.version.outputs.draft }}
        run: |
          if [ "$DRAFT" != "true" ]; then
            # Older release commits may predate the notes output from prepare.
            notes=(--generate-notes)
            if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
              notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
            fi
            gh release create "$TAG" --verify-tag --draft --title "MCSM $TAG" "${notes[@]}"
          fi
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::Refusing to replace assets on a published release."
            exit 1
          fi
          gh release upload "$TAG" "$RUNNER_TEMP/mcsm.zip" --clobber

      - name: Publish the complete release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release edit "$TAG" --draft=false --latest --verify-tag
          url="$(gh release view "$TAG" --json url --jq .url)"
          echo "### Released MCSM $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
