name: Release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          header="$(sed -nE 's/^ \* Version:[[:space:]]*([^[:space:]]+).*/\1/p' mcsm.php | head -n1)"
          constant="$(sed -nE "s/^define\( 'MCSM_VERSION', '([^']+)' \);.*/\1/p" mcsm.php | head -n1)"
          echo "tag=${version} header=${header} constant=${constant}"
          if [ -z "$version" ] || [ "$version" != "$header" ] || [ "$version" != "$constant" ]; then
            echo "::error::Release tag, Version header and MCSM_VERSION must match."
            exit 1
          fi

      - name: Build mcsm.zip
        run: git archive --format=zip --prefix=mcsm/ --output=mcsm.zip HEAD

      - name: Attach package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" mcsm.zip --clobber
